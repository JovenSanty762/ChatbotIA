version: '3.8'

services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: chatbot-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-hospital_chatbot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChatBot WhatsApp
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile.chatbot
    container_name: chatbot-whatsapp
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hospital_chatbot}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      VERIFY_TOKEN: ${VERIFY_TOKEN}
      NGROK_AUTH_TOKEN: ${NGROK_AUTH_TOKEN}
      NGROK_ENABLED: ${NGROK_ENABLED:-true}
      HOSPITAL_NOMBRE: ${HOSPITAL_NOMBRE}
      HOSPITAL_DIRECCION: ${HOSPITAL_DIRECCION}
      HOSPITAL_TELEFONO: ${HOSPITAL_TELEFONO}
    ports:
      - "8000:8000"
    networks:
      - chatbot-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PgAdmin (opcional - para administración)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chatbot-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hospital.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - chatbot-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  chatbot-network:
    driver: bridge
